<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riesgo de abstención por municipio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Riesgo de abstención por municipio</h1>
  <div class="grupo">
    <button data-modo="sin" class="activo">1 · Sin intervención</button>
    <button data-modo="con">2 · Con intervención</button>
    <button data-modo="dif">3 · Diferencia</button>
    <button data-modo="brecha">4 · Brecha interm. vs pres.</button>
  </div>
  <div class="grupo">
    <label>Intervención
      <select id="sel-interv">
        <option value="jovenes">Jóvenes (18–34)</option>
        <option value="hombres">Hombres</option>
        <option value="rural">Zonas rurales</option>
      </select>
    </label>
    <label>Efecto supuesto
      <select id="sel-efecto">
        <option value="5">5%</option>
        <option value="10" selected>10% (caso base)</option>
        <option value="15">15%</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="comparar"> Ver 1 y 2 lado a lado</label>
  </div>
</header>
<div id="aviso"></div>
<div id="resumen"></div>
<div id="mapas">
  <div class="mapa" id="contA"><div class="titulo-mapa" id="tituloA"></div><div id="mapaA"></div></div>
  <div class="mapa" id="contB" hidden><div class="titulo-mapa" id="tituloB"></div><div id="mapaB"></div></div>
  <div id="info">Pasa el cursor sobre un municipio.</div>
  <div id="cargando">Cargando mapa…</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
